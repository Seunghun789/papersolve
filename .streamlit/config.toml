[server]
enableStaticServing = true  # static/fonts 의 글꼴 파일을 앱이 직접 제공한다
maxUploadSize = 30  # MB. Claude 가 한 번에 받는 PDF 는 32MB 까지라 그 안으로 맞춘다
fileWatcherType = "none"  # Streamlit Cloud 는 파일 감시 한도가 차서 경고만 쌓인다. 코드를 바꾸면 서버를 다시 켠다

[browser]
gatherUsageStats = false  # Streamlit 사용 통계를 보내지 않는다

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0F766E"  # app.py COLOR 의 버튼 채움색
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F5"
textColor = "#1F1F1F"
borderColor = "#E4E4E7"
showWidgetBorder = true
font = "IBM Plex Sans KR"  # static/fonts 에서 직접 제공 (SIL OFL 1.1, static/fonts/OFL.txt)
baseFontSize = 14
baseRadius = "8px"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F7F7F8"
secondaryBackgroundColor = "#ECECEE"

[[theme.fontFaces]]
family = "IBM Plex Sans KR"
url = "app/static/fonts/IBMPlexSansKR-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Sans KR"
url = "app/static/fonts/IBMPlexSansKR-Regular.ttf"
weight = 500

[[theme.fontFaces]]
family = "IBM Plex Sans KR"
url = "app/static/fonts/IBMPlexSansKR-SemiBold.ttf"
weight = 600

[[theme.fontFaces]]
family = "IBM Plex Sans KR"
url = "app/static/fonts/IBMPlexSansKR-SemiBold.ttf"
weight = 700
