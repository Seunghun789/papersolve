services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    ports: ["127.0.0.1:8001:8000"]
    env_file: .env.api
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    env_file: .env.worker
    restart: unless-stopped
