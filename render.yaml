services:
  - type: web
    name: passo-dev-api
    branch: clone/goal-47aaee80-8328-4554-b140-1ed1e65408c9
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port 10000
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_SECRET_KEY
        sync: false
# Render has no free background worker. Run `docker compose up -d worker`
# on the Mac; the worker consumes the durable Supabase queue over HTTPS.
